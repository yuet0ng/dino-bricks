<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Bricks English</title>
<meta name="description" content="7岁零基础孩子的英语听力小游戏">
<meta name="theme-color" content="#BCE2CC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dino Bricks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
  <script type="module" crossorigin src="./assets/index-0cEZABWr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-AED4cc3z.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="icon-btn" id="homeBtn" type="button" aria-label="回到首页" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 19.5v-5h4v5z" fill="currentColor"/></svg>
    </button>
    <div class="logo" id="logo"><span class="mark" aria-hidden="true"></span><span>Dino <b>Bricks</b></span></div>
    <div class="dots" id="dots" hidden></div>
    <div class="bar-right">
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停，休息一会" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      </button>
      <div class="mini-tower" id="miniTower" aria-label="积木进度" hidden></div>
      <div class="pill timer" id="timer" aria-label="今天剩余时间">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4l3 2M9 3h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span id="timerText">10</span><small>分钟</small>
        <span class="gauge"><em id="timerFill"></em></span>
      </div>
      <button class="parent-btn" id="parentBtn" type="button" title="家长请长按">
        <span class="fill"></span><span id="parentLabel">家长</span>
      </button>
    </div>
  </header>

  <main id="stage">
    <section id="scr-start" class="screen center">
      <div class="hero">
        <div class="hero-pic">
          <div class="dino me-art" id="startAvatar"></div>
          <div class="hero-bricks" aria-hidden="true">
            <i style="--c:var(--yellow);--w:96px"></i>
            <i style="--c:var(--blue);--w:132px"></i>
            <i style="--c:var(--red);--w:168px"></i>
          </div>
        </div>
        <h1 class="title">Dino <b>Bricks</b></h1>
        <p class="sub">听英语 · 玩游戏 · 搭积木</p>
        <button class="playbtn" id="startBtn" type="button" aria-label="开始">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <p class="tapnote">点一下开始</p>
      </div>
    </section>

    <section id="scr-home" class="screen" hidden>
      <div class="home">
        <aside class="tower-card" aria-label="我的恐龙和积木塔">
          <button class="me" type="button" data-game="dino" aria-label="我的恐龙"><span class="me-art" id="homeAvatar"></span></button>
          <div class="lvlrow" aria-label="等级"><span class="lvl" id="homeLevel">Lv 1</span><span class="lvlbar"><em id="homeLevelBar"></em></span></div>
          <div class="total"><span class="emoji">⭐</span><b id="walletStars">0</b></div>
          <button class="goal" type="button" id="homeGoal" data-game="dino" hidden></button>
          <div class="tower-label"><b id="brickCount">0</b><span>/10</span></div>
          <div class="tower" id="tower"></div>
          <p class="tower-note">一颗星星加一块积木<br>搭满 10 块送新贴纸<br>贴纸集齐了送星星</p>
        </aside>
        <div class="games">
          <button class="game" type="button" data-game="learn" style="--c:var(--yellow);--fg:var(--ink)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🐣</span>
            <span class="txt"><span class="h">New Words</span><span class="zh">学新词，再听音找图</span><em class="badge" id="learnBadge"></em></span>
          </button>
          <button class="game soon" type="button" data-game="soon" style="--c:#A9B6C8;--fg:var(--ink)" aria-label="口语游戏，即将推出">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🎤</span>
            <span class="txt"><span class="h">Say It!</span><span class="zh">口语游戏，即将推出</span><em class="badge">🔒</em></span>
          </button>
          <button class="game" type="button" data-game="catch" style="--c:var(--green)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🔨</span>
            <span class="txt"><span class="h">Catch It!</span><span class="zh" id="catchZh">打地鼠：只点听到的</span><em class="badge" id="catchBadge"></em></span>
          </button>
          <button class="game" type="button" data-game="missing" style="--c:var(--red)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🙈</span>
            <span class="txt"><span class="h">What's Missing?</span><span class="zh" id="missingZh">少了哪一个</span><em class="badge" id="missingBadge"></em></span>
          </button>
          <button class="game" type="button" data-game="dino" style="--c:var(--orange)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic me-art" id="shopPreview"></span>
            <span class="txt"><span class="h">My Dino</span><span class="zh">装扮和商店</span></span>
          </button>
          <button class="game" type="button" data-game="album" style="--c:var(--purple)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji" id="albumPreview">🏆</span>
            <span class="txt"><span class="h">My Stickers</span><span class="zh" id="albumZh">我的贴纸</span></span>
          </button>
        </div>
      </div>
    </section>

    <section id="scr-play" class="screen" hidden></section>

    <section id="scr-dino" class="screen" hidden>
      <div class="room">
        <div class="room-stage">
          <div class="room-dino me-art" id="roomAvatar"></div>
          <div class="room-info"><span class="total"><span class="emoji">⭐</span><b id="roomWallet">0</b></span><span class="lvl" id="roomLevel">Lv 1</span></div>
          <div class="room-act" id="roomAct"></div>
        </div>
        <div class="room-shop">
          <div class="tabs" id="roomTabs" role="tablist" aria-label="部位"></div>
          <div class="items" id="roomItems"></div>
        </div>
      </div>
    </section>

    <section id="scr-album" class="screen" hidden>
      <div class="album-head"><h2 class="title small">My Stickers</h2><p class="sub" id="albumCount"></p></div>
      <div id="album"></div>
    </section>

    <section id="scr-done" class="screen center" hidden>
      <div class="hero">
        <div class="hero-pic"><div class="dino me-art" id="doneAvatar"></div><span class="zz" aria-hidden="true">z z</span></div>
        <h1 class="title small">See you tomorrow!</h1>
        <p class="sub">今天的时间用完啦，明天再来玩！</p>
        <div class="today-stars" id="doneStars"></div>
        <div class="shelf emoji" id="doneShelf"></div>
      </div>
    </section>
  </main>
</div>

<div class="pause-overlay" id="pauseOverlay" hidden>
  <div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseNote">
    <div class="pause-scene" aria-hidden="true">
      <span class="pause-cloud cloud-one"></span><span class="pause-cloud cloud-two"></span>
      <span class="pause-zzz">z z z</span>
      <div class="pause-avatar me-art" id="pauseAvatar"></div>
      <span class="pause-shadow"></span>
    </div>
    <h2 id="pauseTitle">休息一会</h2>
    <p id="pauseNote">准备好了，再一起玩</p>
    <button class="btn go" id="resumeBtn" type="button" aria-label="继续游戏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>继续</span>
    </button>
  </div>
</div>

<div class="overlay" id="resultOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">Great job!</h2>
    <div class="starrow" id="resultStars"></div>
    <p id="resultNote"></p>
    <div class="btnrow" id="resultBtns"></div>
  </div>
</div>

<div class="overlay" id="stickerOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stickerTitle">
    <h2 id="stickerTitle">New sticker!</h2>
    <div class="sticker-stage"><div class="sun"></div><span class="emoji sticker-big" id="stickerBig">🦖</span></div>
    <p id="stickerNote">积木塔搭好啦，得到一张新贴纸！</p>
    <button class="btn go" id="stickerOk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17l9-10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>收下</span>
    </button>
  </div>
</div>

<div class="overlay" id="levelOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="levelTitle">
    <h2 id="levelTitle">Level up!</h2>
    <div class="sticker-stage"><div class="sun"></div><div class="level-dino me-art" id="levelAvatar"></div><span class="lvl big" id="levelNum">2</span></div>
    <p id="levelNote">升级啦！</p>
    <div class="unlocks" id="levelUnlocks"></div>
    <button class="btn go" id="levelOk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17l9-10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>好的</span>
    </button>
  </div>
</div>

<div class="sheet-wrap" id="parentPanel" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
