<style>
/* Layout: one-screen toy baseplate — a studded mint mat with chunky outlined bricks sitting on it.
   Deliberately single-theme: a bright toy world that looks the same on any host. */
:root{
  --mat:#BCE2CC; --stud:#AAD8BD; --stud-hi:#D3EEDD; --tray:#9FD3B6;
  --ink:#1F2A4D; --ink-soft:#56627F; --line-soft:#DCE6E0;
  --paper:#FFFFFF; --paper-2:#F1F7F3; --on-color:#FFFFFF;
  --red:#E5483F; --yellow:#FFC531; --blue:#2F74D9; --green:#2FA866; --orange:#FF8A2B; --purple:#8A5CD6;
  --good:#2FA866; --good-soft:#DCF3E6; --oops:#E5483F;
  --scrim:rgba(31,42,77,.58); --shade:rgba(31,42,77,.14);
  --font-display:"Lilita One","Arial Rounded MT Bold","PingFang SC",sans-serif;
  --font-body:"Baloo 2","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --line:3px; --press:7px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.4;
  background-color:var(--mat);
  background-image:radial-gradient(circle at 46% 40%, var(--stud-hi) 0 2.5px, transparent 3px),
                   radial-gradient(circle, var(--stud) 0 8px, transparent 8.5px);
  background-size:34px 34px;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  touch-action:manipulation; -webkit-touch-callout:none;
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue); outline-offset:3px}
.emoji{font-family:var(--font-emoji); line-height:1; font-style:normal}
svg{display:block}

/* ---------- frame ---------- */
#app{height:100%; max-width:1180px; margin:0 auto; padding-inline:16px; display:flex; flex-direction:column}
.bar{display:flex; align-items:center; gap:10px 14px; padding-block:12px 6px; flex-wrap:wrap; min-height:68px}
.logo{font-family:var(--font-display); font-size:clamp(22px,3.2vw,30px); letter-spacing:.5px; display:flex; align-items:center; gap:10px; white-space:nowrap}
.logo b{font-weight:400; color:var(--red)}
.mark{width:30px; height:16px; background:var(--red); border:var(--line) solid var(--ink); border-radius:4px; position:relative; margin-top:6px}
.mark::before,.mark::after{content:""; position:absolute; top:-9px; width:8px; height:6px; background:var(--red); border:var(--line) solid var(--ink); border-bottom:0; border-radius:3px 3px 0 0}
.mark::before{left:2px} .mark::after{right:2px}
.bar-right{margin-left:auto; display:flex; align-items:center; gap:10px}
.icon-btn{width:52px; height:52px; border-radius:16px; background:var(--paper); border:var(--line) solid var(--ink); box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; padding:0; transition:transform .08s, box-shadow .08s}
.icon-btn svg{width:28px; height:28px}
.icon-btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.dots{display:flex; gap:6px; flex-wrap:wrap}
.dots i{width:16px; height:16px; border-radius:50%; border:2.5px solid var(--ink); background:var(--paper)}
.dots i.done{background:var(--yellow)}
.dots i.now{background:var(--blue)}
.pill{background:var(--paper); border:var(--line) solid var(--ink); border-radius:999px; padding:4px 12px; display:flex; align-items:center; gap:7px; box-shadow:0 3px 0 var(--ink); font-family:var(--font-display); font-size:20px; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill svg{width:20px; height:20px}
.pill small{font-family:var(--font-body); font-size:13px; font-weight:700; color:var(--ink-soft)}
.gauge{width:52px; height:10px; border:2px solid var(--ink); border-radius:6px; overflow:hidden; background:var(--paper-2)}
.gauge em{display:block; height:100%; width:var(--w,100%); background:var(--green); transition:width .6s}
.timer.low .gauge em{background:var(--orange)}
.parent-btn{position:relative; isolation:isolate; overflow:hidden; border:2px dashed var(--ink-soft); background:transparent; color:var(--ink-soft); border-radius:12px; padding:5px 10px; font-size:14px; font-weight:800; white-space:nowrap}
.parent-btn .fill{position:absolute; inset:0; z-index:-1; background:var(--yellow); transform:scaleX(0); transform-origin:left}
.parent-btn.holding .fill{transform:scaleX(1); transition:transform 1.2s linear}
.mini-tower{display:flex; gap:3px; padding:4px 6px; background:var(--paper); border:var(--line) solid var(--ink); border-radius:10px}
.mini-tower i{width:13px; height:18px; border-radius:3px; border:2px solid var(--ink); background:var(--paper-2)}
.mini-tower i.on{background:var(--c)}
.mini-tower i.pop{animation:drop .35s both}
#stage{flex:1; min-height:0; position:relative; overflow-y:auto; overflow-x:hidden; padding-block:8px 22px}
.screen{min-height:100%; display:flex; flex-direction:column}
.center{align-items:center; justify-content:center; text-align:center}

/* ---------- start / done ---------- */
.hero{display:grid; justify-items:center; gap:10px; padding-block:12px}
.hero-pic{position:relative; display:grid; justify-items:center}
.dino{font-size:clamp(96px,18vmin,150px); animation:float 3s ease-in-out infinite}
.hero-bricks{display:grid; justify-items:center; gap:9px; margin-top:4px}
.hero-bricks i{display:block; width:var(--w,130px); height:30px; background:var(--c); border:var(--line) solid var(--ink); border-radius:6px; position:relative}
.hero-bricks i::before,.hero-bricks i::after{content:""; position:absolute; top:-10px; width:22px; height:7px; background:var(--c); border:var(--line) solid var(--ink); border-bottom:0; border-radius:5px 5px 0 0}
.hero-bricks i::before{left:18%} .hero-bricks i::after{right:18%}
.title{margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(48px,9vw,84px); line-height:.95; letter-spacing:1px; text-wrap:balance}
.title b{font-weight:400; color:var(--red)}
.title.small{font-size:clamp(34px,6vw,56px)}
.sub{margin:0; font-weight:800; font-size:clamp(16px,2.2vw,20px); color:var(--ink-soft); letter-spacing:.08em}
.playbtn{width:128px; height:128px; border-radius:50%; background:var(--green); color:var(--on-color); border:4px solid var(--ink); box-shadow:0 9px 0 var(--ink); display:grid; place-items:center; margin-top:10px; transition:transform .08s, box-shadow .08s; animation:pulse 1.8s ease-in-out infinite}
.playbtn svg{width:62px; height:62px; margin-left:8px}
.playbtn:active{transform:translateY(7px); box-shadow:0 2px 0 var(--ink)}
.tapnote{margin:4px 0 0; font-weight:700; color:var(--ink-soft)}
.zz{position:absolute; right:-28px; top:0; font-family:var(--font-display); font-size:34px; color:var(--blue); animation:float 2.4s ease-in-out infinite}
.today-stars{font-family:var(--font-display); font-size:30px; display:flex; align-items:center; gap:8px}
.shelf{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:560px; font-size:40px}

/* ---------- home ---------- */
.home{display:grid; grid-template-columns:minmax(170px,230px) minmax(0,1fr); gap:24px; align-items:start; padding-top:14px}
.tower-card{background:var(--paper); border:var(--line) solid var(--ink); border-radius:22px; box-shadow:0 var(--press) 0 var(--ink); padding:16px; display:grid; gap:12px; justify-items:center; text-align:center}
.tower-label{font-family:var(--font-display); font-size:44px; line-height:1; font-variant-numeric:tabular-nums}
.tower-label span{font-size:24px; color:var(--ink-soft)}
.tower{display:flex; flex-direction:column-reverse; gap:9px; width:100%; padding-top:10px}
.tower i{display:block; height:24px; border:var(--line) dashed var(--ink-soft); border-radius:6px; background:var(--paper-2); position:relative}
.tower i.on{border-style:solid; border-color:var(--ink); background:var(--c)}
.tower i.on::before,.tower i.on::after{content:""; position:absolute; top:-10px; width:18px; height:7px; background:var(--c); border:var(--line) solid var(--ink); border-bottom:0; border-radius:4px 4px 0 0}
.tower i.on::before{left:20%} .tower i.on::after{right:20%}
.tower i.pop{animation:drop .4s both}
.tower-note{margin:0; font-size:14px; font-weight:700; color:var(--ink-soft); line-height:1.5}
.total{display:flex; align-items:center; gap:6px; font-family:var(--font-display); font-size:26px; font-variant-numeric:tabular-nums}
.total .emoji{font-size:26px}
.games{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:34px 18px; padding-top:14px}
.game{--c:var(--red); --fg:var(--on-color); position:relative; text-align:left; background:var(--c); color:var(--fg); border:var(--line) solid var(--ink); border-radius:18px; box-shadow:0 var(--press) 0 var(--ink); padding:16px 18px; min-height:150px; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:16px; transition:transform .08s, box-shadow .08s}
.game:active{transform:translateY(5px); box-shadow:0 2px 0 var(--ink)}
.studs{position:absolute; top:-14px; left:0; right:0; display:flex; justify-content:space-evenly; pointer-events:none}
.studs i{width:clamp(26px,4vw,40px); height:14px; background:var(--c); border:var(--line) solid var(--ink); border-bottom:0; border-radius:8px 8px 0 0}
.game .pic{width:clamp(66px,9vw,96px); aspect-ratio:1; border-radius:50%; background:var(--paper); border:var(--line) solid var(--ink); display:grid; place-items:center; font-size:clamp(36px,5vw,54px)}
.game .txt{display:grid; gap:2px; min-width:0}
.game .h{font-family:var(--font-display); font-size:clamp(21px,2.8vw,32px); line-height:1.05}
.game .zh{font-weight:800; font-size:clamp(15px,1.8vw,19px); opacity:.95}
.badge{justify-self:start; font-style:normal; background:var(--paper); color:var(--ink); border:2px solid var(--ink); border-radius:999px; padding:0 9px; font-size:13px; font-weight:800; margin-top:4px}
.badge:empty{display:none}
.game.wide{grid-column:1/-1; min-height:104px}
.game.wide .pic{width:auto; aspect-ratio:auto; border-radius:999px; padding:6px 14px; font-size:clamp(28px,4vw,40px); display:flex; gap:4px; min-width:90px; justify-content:center}

/* ---------- play ---------- */
.play{flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.6vh,24px); padding-top:6px}
.cue{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
.speak{width:78px; height:78px; border-radius:50%; background:var(--yellow); border:var(--line) solid var(--ink); box-shadow:0 6px 0 var(--ink); display:grid; place-items:center; transition:transform .08s, box-shadow .08s}
.speak svg{width:40px; height:40px}
.speak:active{transform:translateY(5px); box-shadow:0 1px 0 var(--ink)}
.speak.talking{animation:pulse .8s ease-in-out infinite}
.hint{font-size:clamp(16px,2.2vw,20px); font-weight:800; background:var(--paper); border:var(--line) solid var(--ink); border-radius:16px; padding:6px 16px}
.cards{display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(12px,2.4vw,24px); width:100%}
.cards.done{pointer-events:none}
.pcard{width:clamp(96px,calc((100% - 72px)/4),210px); aspect-ratio:1; max-width:100%; padding:0; background:var(--paper); border:var(--line) solid var(--ink); border-radius:24px; box-shadow:0 var(--press) 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4%; position:relative; font-size:clamp(58px,12vmin,120px); transition:transform .08s, box-shadow .08s, opacity .25s, filter .25s; animation:pop .35s both}
button.pcard:active{transform:translateY(5px); box-shadow:0 2px 0 var(--ink)}
.pcard.big{width:clamp(200px,40vmin,330px); font-size:clamp(110px,23vmin,210px); border-radius:32px}
.pcard.mid{width:clamp(78px,calc((100% - 96px)/5),160px); font-size:clamp(44px,9vmin,96px); border-radius:20px}
.pcard.good{background:var(--good-soft); border-color:var(--good); box-shadow:0 var(--press) 0 var(--good); animation:bounce .5s}
.pcard.off{opacity:.35; filter:grayscale(.7); pointer-events:none}
.pcard.shake{animation:shake .45s}
.pcard.bump{animation:bounce .45s}
.pcard.hole{background:var(--paper-2); border-style:dashed; box-shadow:none; animation:none}
.q{font-family:var(--font-display); font-size:.62em; color:var(--ink-soft)}
.blob{width:62%; aspect-ratio:1; background:var(--b); border:var(--line) solid var(--ink); border-radius:56% 44% 52% 48% / 48% 56% 44% 52%; box-shadow:inset -8px -10px 0 var(--shade)}
.num{font-family:var(--font-display); font-size:.86em; line-height:.9; color:var(--blue)}
.ndots{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; width:66%}
.ndots i{width:clamp(7px,1.3vmin,12px); aspect-ratio:1; border-radius:50%; background:var(--orange); border:1.5px solid var(--ink)}
.tray{background:var(--tray); border:var(--line) solid var(--ink); border-radius:26px; padding:16px; width:auto; max-width:100%}
.tray:empty{display:none}
.catches{display:flex; gap:8px}
.catches i{width:38px; height:24px; border:var(--line) dashed var(--ink-soft); border-radius:6px; background:var(--paper-2)}
.catches i.on{border-style:solid; border-color:var(--ink); background:var(--yellow); animation:drop .35s both}
.field{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(8px,2vw,18px); width:min(520px,100%)}
.cell{position:relative; aspect-ratio:1; overflow:hidden; border-radius:0 0 12px 12px}
.cell::before{content:""; position:absolute; left:7%; right:7%; bottom:16%; height:20%; border-radius:50%; background:var(--ink); z-index:0}
.mole{position:absolute; left:13%; right:13%; bottom:17%; height:68%; padding:0; z-index:1; background:var(--paper); border:var(--line) solid var(--ink); border-radius:46% 46% 14px 14px / 36% 36% 14px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4%; font-size:clamp(32px,8.5vmin,70px); transform:translateY(120%); transition:transform .2s ease-out; touch-action:manipulation}
.cell.up .mole{transform:translateY(0)}
.cell:not(.up) .mole{pointer-events:none}
.mole.good{background:var(--good-soft); border-color:var(--good)}
.mole.bad{background:var(--paper-2); filter:grayscale(.7); animation:shake .4s}
.front{position:absolute; left:0; right:0; bottom:0; height:26%; z-index:2; background:var(--c); border:var(--line) solid var(--ink); border-radius:10px}
@media (orientation:landscape){ .field{width:min(520px,100%,62vh)} }
.note{font-weight:800; font-size:18px; background:var(--paper); color:var(--red); border:var(--line) solid var(--red); border-radius:14px; padding:6px 14px; animation:pop .3s both}
.eyes{position:absolute; inset:-6px; z-index:5; background:var(--ink); border-radius:26px; display:grid; place-items:center; align-content:center; gap:6px; color:var(--yellow)}
.eyes .emoji{font-size:clamp(90px,18vmin,140px)}
.eyes b{font-family:var(--font-display); font-weight:400; font-size:clamp(60px,12vmin,96px); line-height:1}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-display); font-size:24px; padding:12px 24px; border-radius:18px; border:var(--line) solid var(--ink); box-shadow:0 6px 0 var(--ink); background:var(--yellow); color:var(--ink); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(5px); box-shadow:0 1px 0 var(--ink)}
.btn svg{width:28px; height:28px}
.btn.go{background:var(--green); color:var(--on-color)}
.btn.next{min-width:150px}

/* ---------- album ---------- */
.album-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding-block:10px 16px}
.album{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:18px}
.slot{position:relative; aspect-ratio:1; background:var(--paper); border:var(--line) solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; font-size:clamp(46px,8vmin,64px); padding:0}
.slot.empty{background:var(--paper-2); border-style:dashed; border-color:var(--ink-soft); box-shadow:none}
.slot.empty .q{font-size:40px}
.count{position:absolute; top:-10px; right:-10px; font-family:var(--font-display); font-size:16px; background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:1px 8px}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; z-index:20; background:var(--scrim); display:grid; place-items:center; padding:16px}
.dialog{position:relative; background:var(--paper); border:var(--line) solid var(--ink); border-radius:28px; box-shadow:0 10px 0 var(--ink); padding:26px 22px; width:min(520px,100%); display:grid; gap:16px; justify-items:center; text-align:center; animation:pop .35s both}
.dialog h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(38px,7vw,52px); line-height:1; color:var(--red)}
.dialog p{margin:0; font-weight:700; color:var(--ink-soft)}
.starrow{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; font-size:40px; min-height:40px}
.starrow .emoji{animation:pop .4s both}
.btnrow{display:flex; flex-wrap:wrap; justify-content:center; gap:14px}
.sticker-stage{position:relative; width:260px; max-width:100%; aspect-ratio:1; display:grid; place-items:center}
.sun{position:absolute; inset:0; border-radius:50%; background:repeating-conic-gradient(var(--yellow) 0 12deg, transparent 12deg 24deg); -webkit-mask:radial-gradient(circle, #000 35%, transparent 70%); mask:radial-gradient(circle, #000 35%, transparent 70%); animation:spin 9s linear infinite}
.sticker-big{position:relative; font-size:140px; animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:45}
.flystar{position:fixed; z-index:40; font-size:46px; pointer-events:none; transform:translate(-50%,-50%)}

/* ---------- parent panel ---------- */
.sheet-wrap{position:fixed; inset:0; z-index:30; background:var(--scrim); display:grid; place-items:center; padding:16px}
.sheet{background:var(--paper); color:var(--ink); border:var(--line) solid var(--ink); border-radius:22px; width:min(700px,100%); max-height:100%; overflow:auto; padding:20px; display:grid; gap:20px; font-size:15px; -webkit-user-select:text; user-select:text; animation:pop .25s both}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.sheet h2{margin:0; font-size:22px; font-weight:800}
.sheet h3{margin:0 0 10px; font-size:16px; font-weight:800}
.sheet h4{margin:12px 0 6px; font-size:14px; font-weight:800; color:var(--ink-soft)}
.sheet p{margin:0}
.sheet section{display:grid; gap:6px}
.sync{font-size:14px; font-weight:700; border-radius:12px; padding:8px 12px; background:var(--paper-2)}
.sync.cloud{background:var(--good-soft)}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.kpi{background:var(--paper-2); border-radius:14px; padding:10px 12px; min-width:0}
.kpi b{display:block; font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi span{font-size:13px; color:var(--ink-soft); font-weight:700}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:7px 8px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap}
th{font-size:13px; color:var(--ink-soft); font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:2px solid var(--ink); border-radius:999px; background:var(--paper); padding:2px 10px 2px 6px; font-size:15px; font-weight:700; display:inline-flex; gap:5px; align-items:center}
.chip .emoji{font-size:18px}
.chip .dot{width:14px; height:14px; border-radius:50%; background:var(--b); border:1.5px solid var(--ink)}
.chip small{color:var(--red); font-weight:800}
.muted{color:var(--ink-soft)}
.row{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.row > span:first-child{min-width:64px; font-weight:800}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:12px; overflow:hidden}
.seg button{border:0; border-left:2px solid var(--ink); background:var(--paper); padding:6px 13px; font-weight:800; font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--yellow)}
.sbtn{border:2px solid var(--ink); border-radius:12px; background:var(--yellow); padding:6px 14px; font-weight:800}
.sbtn.ghost{background:var(--paper)}
.units{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
.unit{display:flex; gap:8px; align-items:center; border:2px solid var(--ink); border-radius:12px; padding:8px 10px; font-weight:700; cursor:pointer}
.unit input{width:20px; height:20px; accent-color:var(--green); margin:0}
.unit small{margin-left:auto; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.tip{background:var(--paper-2); border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.6}
.io{display:grid; gap:8px}
.io textarea{width:100%; min-height:96px; resize:vertical; font:13px/1.45 ui-monospace,Menlo,monospace; color:var(--ink); background:var(--paper-2); border:2px solid var(--ink); border-radius:12px; padding:8px 10px; word-break:break-all; -webkit-user-select:text; user-select:text}
.io-msg{font-weight:700; color:var(--green)}
.io-msg.err{color:var(--red)}

/* ---------- motion ---------- */
@keyframes pop{from{transform:scale(.6); opacity:0} to{transform:none; opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}}
@keyframes bounce{0%{transform:none} 40%{transform:translateY(-16px) scale(1.05)} 100%{transform:none}}
@keyframes drop{from{transform:translateY(-26px); opacity:0} to{transform:none; opacity:1}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.07)}}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}

@media (max-width:700px){
  .home{grid-template-columns:minmax(0,1fr)}
  .tower-card{grid-template-columns:auto minmax(0,1fr); justify-items:stretch; text-align:left; align-items:center}
  .tower{flex-direction:row; grid-column:1/-1; order:3}
  .tower i{flex:1; height:26px}
  .tower i.on::before{left:12%} .tower i.on::after{right:12%}
  .tower i.on::before,.tower i.on::after{width:10px}
  .tower-note{grid-column:1/-1; order:4}
}
@media (max-width:560px){
  .game{grid-template-columns:minmax(0,1fr); justify-items:center; text-align:center; min-height:0; padding:14px 10px}
  .badge{justify-self:center}
  .cards > .pcard:not(.big){width:calc((100% - 14px)/2); max-width:170px}
  .pcard.mid{width:calc((100% - 28px)/3)}
  .pill small{display:none}
  .gauge{width:36px}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="icon-btn" id="homeBtn" type="button" aria-label="回到首页" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 19.5v-5h4v5z" fill="currentColor"/></svg>
    </button>

  <main id="stage">
    <section id="scr-start" class="screen center">
      <div class="hero">
        <div class="hero-pic">

          </div>

        </button>

    <section id="scr-home" class="screen" hidden>

          </button>
          <button class="game wide" type="button" data-game="album" style="--c:var(--purple)">
            <span class="studs"><i></i><i></i><i></i><i></i><i></i></span>

    </section>

    <section id="scr-play" class="screen" hidden></section>

    <section id="scr-album" class="screen" hidden>
      <div class="album-head"><h2 class="title small">My Stickers</h2><p class="sub" id="albumCount"></p></div>
      <div class="album" id="album"></div>
    </section>

    <section id="scr-done" class="screen center" hidden>
      <div class="hero">
        <div class="hero-pic"><span class="emoji dino">🦖</span><span class="zz" aria-hidden="true">z z</span></div>
        <h1 class="title small">See you tomorrow!</h1>
        <p class="sub">今天的时间用完啦，明天再来玩！</p>
        <div class="today-stars" id="doneStars"></div>

      </div>

  </main>
</div>

<div class="overlay" id="resultOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">Great job!</h2>
    <div class="starrow" id="resultStars"></div>
    <p id="resultNote"></p>
    <div class="btnrow" id="resultBtns"></div>
  </div>
</div>

<div class="overlay" id="stickerOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stickerTitle">
    <h2 id="stickerTitle">New sticker!</h2>
    <div class="sticker-stage"><div class="sun"></div><span class="emoji sticker-big" id="stickerBig">🦖</span></div>
    <p>积木塔搭好啦，得到一张新贴纸！</p>
    <button class="btn go" id="stickerOk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17l9-10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>收下</span>
    </button>
  </div>
</div>

<div class="sheet-wrap" id="parentPanel" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';

/* =====================================================================
   CONTENT — add a unit here when the class word list arrives.
   Each word: [english, picture]. Picture is an emoji, a colour, or a number.
   ===================================================================== */
const UNITS = [
  { id:'animals', zh:'动物', words:[
    ['cat','🐱'],['dog','🐶'],['bird','🐦'],['fish','🐟'],['duck','🦆'],['pig','🐷'],['cow','🐮'],['horse','🐴'],
    ['rabbit','🐰'],['frog','🐸'],['bear','🐻'],['panda','🐼'],['monkey','🐵'],['lion','🦁'],['tiger','🐯'],['elephant','🐘'] ]},
  { id:'colors', zh:'颜色', kind:'color', words:[
    ['red','#E5483F'],['blue','#2F74D9'],['yellow','#FFC531'],['green','#2FA866'],['orange','#FF8A2B'],
    ['purple','#8A5CD6'],['pink','#FF8FC0'],['brown','#8B5A3C'],['black','#22252B'],['white','#FFFFFF'] ]},
  { id:'numbers', zh:'数字 1–10', kind:'number', words:[
    ['one',1],['two',2],['three',3],['four',4],['five',5],['six',6],['seven',7],['eight',8],['nine',9],['ten',10] ]},
  { id:'toys', zh:'交通和玩具', words:[
    ['car','🚗'],['bus','🚌'],['train','🚂'],['plane','✈️'],['boat','⛵'],['bike','🚲'],['truck','🚚'],
    ['rocket','🚀'],['robot','🤖'],['ball','⚽'],['dinosaur','🦖'],['kite','🪁'] ]},
  { id:'body', zh:'身体', words:[
    ['eye','👁️'],['ear','👂'],['nose','👃'],['mouth','👄'],['hand','✋'],['foot','🦶'],['leg','🦵'],['arm','💪'],['tooth','🦷'] ]},
  { id:'food', zh:'水果和食物', words:[
    ['apple','🍎'],['banana','🍌'],['grapes','🍇',{plural:true}],['watermelon','🍉'],['strawberry','🍓'],['pear','🍐'],
    ['peach','🍑'],['carrot','🥕'],['egg','🥚'],['milk','🥛'],['bread','🍞'],['cake','🍰'],['cookie','🍪'],['ice cream','🍦'] ]},
];

const STICKERS = [
  {id:'t-rex',pic:'🦖',say:'T-Rex',a:'a'}, {id:'long-neck',pic:'🦕',say:'long-neck dinosaur',a:'a'},
  {id:'dragon',pic:'🐉',say:'dragon',a:'a'}, {id:'shark',pic:'🦈',say:'shark',a:'a'},
  {id:'octopus',pic:'🐙',say:'octopus',a:'an'}, {id:'eagle',pic:'🦅',say:'eagle',a:'an'},
  {id:'owl',pic:'🦉',say:'owl',a:'an'}, {id:'whale',pic:'🐳',say:'whale',a:'a'},
  {id:'fire-truck',pic:'🚒',say:'fire truck',a:'a'}, {id:'police-car',pic:'🚓',say:'police car',a:'a'},
  {id:'ambulance',pic:'🚑',say:'ambulance',a:'an'}, {id:'race-car',pic:'🏎️',say:'race car',a:'a'},
  {id:'tractor',pic:'🚜',say:'tractor',a:'a'}, {id:'helicopter',pic:'🚁',say:'helicopter',a:'a'},
  {id:'space-rocket',pic:'🚀',say:'rocket',a:'a'}, {id:'ufo',pic:'🛸',say:'UFO',a:'a'},
  {id:'robot',pic:'🤖',say:'robot',a:'a'}, {id:'superhero',pic:'🦸',say:'superhero',a:'a'},
  {id:'ninja',pic:'🥷',say:'ninja',a:'a'}, {id:'astronaut',pic:'🧑‍🚀',say:'astronaut',a:'an'},
  {id:'castle',pic:'🏰',say:'castle',a:'a'}, {id:'volcano',pic:'🌋',say:'volcano',a:'a'},
  {id:'planet',pic:'🪐',say:'planet',a:'a'}, {id:'trophy',pic:'🏆',say:'trophy',a:'a'},
];

const PRAISE = ['Great!','Good job!','Well done!','Super!','Awesome!','Excellent!','Wonderful!','Yes!'];
const GAME_NAMES = {learn:'New words!', listen:'Listen and tap!', catch:'Catch it!', missing:"What's missing?", album:'My stickers!'};
const ROUNDS = {listen:8, catch:5, missing:5};
const MIN_KNOWN = {listen:3, catch:3, missing:4};
const BRICK_COLORS = ['var(--red)','var(--yellow)','var(--blue)','var(--green)','var(--orange)'];

const SVG_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const SVG_NEXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const SVG_AGAIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_HOME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

const WORDS = {}, UNIT_BY_ID = {};
for (const u of UNITS) {
  UNIT_BY_ID[u.id] = u; u.ids = [];
  for (const [say, pic, opt] of u.words) {
    const id = say.replace(/\s+/g, '-');
    WORDS[id] = {id, say, pic, unit:u.id, kind:u.kind || 'emoji', plural:!!(opt && opt.plural)};
    u.ids.push(id);
  }
}

/* =====================================================================
   STATE — localStorage always; the artifact's shared db when available
   ===================================================================== */
const LS_KEY = 'dino-bricks-v1';
const DEFAULT_SETTINGS = {minutes:10, units:['animals','colors','numbers'], rate:'normal', extra:null, updatedAt:0};
const blankProgress = () => ({totalStars:0, bricks:0, stickers:{}, words:{}, updatedAt:0});

function normProgress(p) {
  p = p || {};
  return {
    totalStars: Math.max(0, +p.totalStars || 0),
    bricks: Math.min(10, Math.max(0, +p.bricks || 0)),
    stickers: p.stickers && typeof p.stickers === 'object' ? p.stickers : {},
    words: p.words && typeof p.words === 'object' ? p.words : {},
    updatedAt: +p.updatedAt || 0,
  };
}
function normSettings(s) {
  s = s || {};
  const units = Array.isArray(s.units) ? s.units.filter(u => UNIT_BY_ID[u]) : [];
  const x = s.extra && typeof s.extra === 'object' && typeof s.extra.date === 'string' ? {date:s.extra.date, minutes:Math.max(0, +s.extra.minutes || 0)} : null;
  return {
    minutes: [5,10,15,20,30].includes(+s.minutes) ? +s.minutes : DEFAULT_SETTINGS.minutes,
    units: units.length ? units : DEFAULT_SETTINGS.units.slice(),
    rate: s.rate === 'slow' ? 'slow' : 'normal',
    extra: x,
    updatedAt: +s.updatedAt || 0,
  };
}
function normDay(d, key) {
  d = d || {};
  const plays = d.plays && typeof d.plays === 'object' ? d.plays : {};
  return {date:key, seconds:+d.seconds || 0, stars:+d.stars || 0, right:+d.right || 0, wrong:+d.wrong || 0, plays};
}

const S = {progress:blankProgress(), settings:normSettings(DEFAULT_SETTINGS), days:{}};
(function loadLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!v) return;
    S.progress = normProgress(v.progress);
    S.settings = normSettings(v.settings);
    if (v.days && typeof v.days === 'object') for (const k of Object.keys(v.days)) S.days[k] = normDay(v.days[k], k);
  } catch (e) { /* storage blocked: start fresh */ }
})();

function persistLocal() {
  const keys = Object.keys(S.days).sort();
  while (keys.length > 60) delete S.days[keys.shift()];
  try { localStorage.setItem(LS_KEY, JSON.stringify({v:1, progress:S.progress, settings:S.settings, days:S.days})); } catch (e) {}
}
function today() {
  const k = dayKey();
  if (!S.days[k]) S.days[k] = normDay(null, k);
  return S.days[k];
}
function limitSec() {
  const x = S.settings.extra;
  return (S.settings.minutes + (x && x.date === dayKey() ? x.minutes : 0)) * 60;
}
const timeLeft = () => Math.max(0, limitSec() - today().seconds);

const dirty = {progress:false, day:false};
function touchProgress() { S.progress.updatedAt = Date.now(); dirty.progress = true; persistLocal(); }
function saveAll() {
  persistLocal();
  if (dirty.progress) { dirty.progress = false; cloudSave('kid/progress', () => S.progress); }
  if (dirty.day) { dirty.day = false; const k = dayKey(); cloudSave('days/' + k, () => S.days[k]); }
}
function saveSettings() {
  S.settings.updatedAt = Date.now();
  persistLocal();
  cloudSave('kid/settings', () => S.settings);
}

/* ---------- cloud (db capability) ---------- */
let db = null, syncState = 'connecting', daysCache = null;
const writers = {};
function setSync(s) { syncState = s; if (!$('#parentPanel').hidden) renderParent(); }
function cloudSave(path, getter) {
  if (!db || syncState === 'readonly') return;
  const w = writers[path] || (writers[path] = {busy:false, dirty:false, getter:null, tries:0});
  w.getter = getter; w.dirty = true; pump(path);
}
async function pump(path) {
  const w = writers[path];

  w.busy = true; w.dirty = false;
  try {
    await db.doc(path).set(clone(w.getter()));
    w.tries = 0;
    if (syncState !== 'cloud') setSync('cloud');
  } catch (e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && w.tries < 3) {
      w.tries++; w.busy = false;
      setTimeout(() => { w.dirty = true; pump(path); }, 1200 + Math.random() * 1500 * w.tries);
      return;
    }
    if (code === 'invalid_argument') setSync('readonly');
    else if (['revoked','not_granted','capability_disabled','capability_removed'].includes(code)) { db = null; setSync('local'); }
  }

  if (w.dirty) pump(path);
}
function onDbError(e) {
  const code = e && e.code;
  if (['revoked','not_granted','capability_disabled','capability_removed'].includes(code)) { db = null; setSync('local'); }
}
async function connect() {
  let ns = null;
  try { if (window.claude && typeof window.claude.use === 'function') ns = await window.claude.use('db'); } catch (e) { ns = null; }
  if (!ns) { setSync('local'); return; }
  db = ns;
  const k = dayKey();
  let got = null;
  for (let attempt = 0; attempt < 2 && !got; attempt++) {
    try {
      got = await Promise.all([db.doc('kid/progress').get(), db.doc('kid/settings').get(), db.doc('days/' + k).get()]);
    } catch (e) {
      if (e && e.code === 'unavailable' && attempt === 0) { await wait(1200 + Math.random() * 800); continue; }
      onDbError(e); if (db) { db = null; setSync('local'); }
      return;
    }
  }
  if (!got) { db = null; setSync('local'); return; }
  const [p, s, t] = got;
  if (p.exists) {
    const r = normProgress(clone(p.data()));
    if (r.updatedAt >= S.progress.updatedAt) S.progress = r; else dirty.progress = true;
  } else if (S.progress.updatedAt > 0) dirty.progress = true;
  if (s.exists) {
    const r = normSettings(clone(s.data()));
    if (r.updatedAt >= S.settings.updatedAt) S.settings = r; else cloudSave('kid/settings', () => S.settings);
  } else if (S.settings.updatedAt > 0) cloudSave('kid/settings', () => S.settings);
  if (t.exists) {
    const r = normDay(clone(t.data()), k), d = today();
    d.seconds = Math.max(d.seconds, r.seconds); d.stars = Math.max(d.stars, r.stars);
    d.right = Math.max(d.right, r.right); d.wrong = Math.max(d.wrong, r.wrong);
    for (const g of Object.keys(r.plays)) d.plays[g] = Math.max(d.plays[g] || 0, +r.plays[g] || 0);
  }
  setSync('cloud');
  saveAll();
  refreshAll();
  db.doc('kid/settings').onSnapshot(snap => {
    if (!snap.exists || snap.metadata.hasPendingWrites) return;
    const r = normSettings(clone(snap.data()));
    if (r.updatedAt > S.settings.updatedAt) { S.settings = r; persistLocal(); refreshAll(); }
  }, onDbError);
  db.doc('kid/progress').onSnapshot(snap => {
    if (!snap.exists || snap.metadata.hasPendingWrites || current === 'play') return;
    const r = normProgress(clone(snap.data()));
    if (r.updatedAt > S.progress.updatedAt) { S.progress = r; persistLocal(); refreshAll(); }
  }, onDbError);
}

/* =====================================================================
   SOUND — speech for English, tiny synth for effects
   ===================================================================== */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voice = null, talking = 0;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed/i;
const PREFERRED = ['Samantha','Ava','Allison','Susan','Karen','Daniel','Serena','Moira','Tessa','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Zira'];
function pickVoice() {
  if (!synth) return;
  let vs = [];
  try { vs = synth.getVoices() || []; } catch (e) {}
  const en = vs.filter(v => /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name))
               .sort((a, b) => (/(Enhanced|Premium)/.test(b.name) ? 1 : 0) - (/(Enhanced|Premium)/.test(a.name) ? 1 : 0));
  for (const p of PREFERRED) { const v = en.find(v => v.name.includes(p)); if (v) { voice = v; return; } }
  voice = en.find(v => /en[-_]US/i.test(v.lang)) || en[0] || null;
}
function setTalking() {
  const b = document.getElementById('speakBtn');
  if (b) b.classList.toggle('talking', talking > 0);
}
function say(text, o = {}) {
  return new Promise(resolve => {
    if (!synth || !text) { resolve(); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; talking = Math.max(0, talking - 1); setTalking(); resolve(); };
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voice ? voice.lang : 'en-US';
      if (voice) u.voice = voice;
      u.rate = (S.settings.rate === 'slow' ? 0.68 : 0.86) * (o.rate || 1);
      u.pitch = o.pitch || 1.05;
      u.onend = fin; u.onerror = fin;
      talking++; setTalking();
      synth.speak(u);
      setTimeout(fin, 1600 + text.length * 150);
    } catch (e) { fin(); }
  });
}
function hush() { if (synth) { try { synth.cancel(); } catch (e) {} } talking = 0; setTalking(); }

let ac = null;
function actx() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
  return ac;
}
function tone(f, start, dur, type = 'sine', vol = 0.12) {
  const c = actx(); if (!c) return;
  try {
    const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  good() { tone(784, 0, .18, 'triangle'); tone(1175, .1, .3, 'triangle'); },
  oops() { tone(262, 0, .22, 'sine', .1); tone(196, .13, .28, 'sine', .08); },
  brick() { tone(1500, 0, .05, 'square', .04); tone(950, .045, .08, 'square', .035); },
  tick() { tone(660, 0, .07, 'sine', .07); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .12)); tone(1319, .5, .7, 'triangle', .1); },
};

/* =====================================================================
   WORD PICKING — new words, weighted review
   ===================================================================== */
const statOf = id => S.progress.words[id] || null;
const isKnown = id => (statOf(id) || {}).seen > 0;
const activeIds = () => S.settings.units.flatMap(u => UNIT_BY_ID[u] ? UNIT_BY_ID[u].ids : []);
const known = () => activeIds().filter(isKnown);
function weight(id) {
  const st = statOf(id);
  if (!st || !st.seen) return 0;
  if (st.k >= 3) return 0.5;
  return 1.2 + Math.min(2.5, (st.w || 0) * 0.6) + (st.r ? 0 : 0.8);
}
function weightedPick(ids) {
  let tot = 0;
  const ws = ids.map(id => { const w = Math.max(0.2, weight(id) || 1); tot += w; return w; });
  let r = Math.random() * tot;
  for (let i = 0; i < ids.length; i++) { r -= ws[i]; if (r <= 0) return ids[i]; }
  return ids[ids.length - 1];
}
function pickTarget(ids) {
  const cands = ids.filter(id => !G.recent.includes(id));
  const id = weightedPick(cands.length ? cands : ids);
  G.recent.push(id); if (G.recent.length > 2) G.recent.shift();
  return WORDS[id];
}
function distractors(target, n, exclude = []) {
  const ex = new Set([target.id, ...exclude]);
  const k = known();
  const sameKnown = shuffle(k.filter(id => WORDS[id].unit === target.unit && !ex.has(id)));
  const otherKnown = shuffle(k.filter(id => WORDS[id].unit !== target.unit && !ex.has(id)));
  const unitRest = shuffle(UNIT_BY_ID[target.unit].ids.filter(id => !ex.has(id) && !isKnown(id)));
  const anyRest = shuffle(activeIds().filter(id => !ex.has(id)));
  const out = [];
  for (const id of [...sameKnown, ...otherKnown, ...unitRest, ...anyRest]) {
    if (out.length >= n) break;
    if (!out.includes(id)) out.push(id);
  }
  return out.map(id => WORDS[id]);
}
function nextNewWords(n, peek) {
  const take = () => {
    const queues = S.settings.units.filter(u => UNIT_BY_ID[u]).map(u => UNIT_BY_ID[u].ids.filter(id => !isKnown(id)));
    const out = [];
    for (let i = 0; out.length < n && queues.some(q => q.length); i++) { const q = queues[i % queues.length]; if (q.length) out.push(q.shift()); }
    return out.map(id => WORDS[id]);
  };
  let words = take();
  if (!words.length && !peek) {
    // every word in the chosen units is introduced: switch on the next unit automatically
    const next = UNITS.find(u => !S.settings.units.includes(u.id));
    if (next) { S.settings.units.push(next.id); saveSettings(); words = take(); }
  }
  return words;
}
function recordWord(w, first) {
  const st = S.progress.words[w.id] || (S.progress.words[w.id] = {seen:1, r:0, w:0, k:0, t:0});
  if (first) { st.r++; st.k++; } else { st.w++; st.k = 0; }
  st.t = Date.now();
  touchProgress();
}
function recordRound(first) {
  const d = today();
  if (first) d.right++; else d.wrong++;
  dirty.day = true;
}
function picHTML(w) {
  if (w.kind === 'color') return `<span class="blob" style="--b:${w.pic}"></span>`;
  if (w.kind === 'number') return `<span class="num">${w.pic}</span><span class="ndots">${'<i></i>'.repeat(w.pic)}</span>`;
  return `<span class="emoji">${w.pic}</span>`;
}
function whereIs(w) {

  if (w.kind === 'number') return `Where is number ${w.say}?`;
  return w.plural ? `Where are the ${w.say}?` : `Where is the ${w.say}?`;
}
function nameOf(w) {

  if (w.kind === 'number') return `Number ${w.say}`;
  return `The ${w.say}`;
}

/* ---------- Listen & Tap round (also used by New Words check) ---------- */
async function listenRound(t, target, choices) {
  stage(cue('听一听，点出对的图片') + `<div class="cards" id="cards">${choices.map((w, i) => cardBtn(w, i)).join('')}</div>`);
  const cards = $('#cards');
  const speakIt = async () => { await say(whereIs(target)); };
  onSpeak = () => { hush(); speakIt(); };
  await wait(350); if (!alive(t)) return;
  await speakIt(); if (!alive(t)) return;
  let first = true;
  for (;;) {
    const c = await nextTap(); if (!alive(t) || !c) return;
    if (c.dataset.id === target.id) {
      hush(); c.classList.add('good'); cards.classList.add('done'); sfx.good();
      recordWord(target, first); recordRound(first);
      if (first) await giveStar(c);
      say(pick(PRAISE)); await wait(1100);
      return;
    }
    first = false; hush(); sfx.oops();
    c.classList.add('shake', 'off');
    await say('Try again!'); if (!alive(t)) return;
    await say(target.say);
  }
}

/* ---------- New Words ---------- */
async function playLearn(t) {
  let words = nextNewWords(4);
  const fresh = words.length > 0;
  if (!fresh) words = known().sort((a, b) => weight(b) - weight(a)).slice(0, 4).map(id => WORDS[id]);
  if (!words.length) words = activeIds().slice(0, 4).map(id => WORDS[id]);
  setupPlay('learn', words.length * 2);
  await say(fresh ? 'New words!' : "Let's practice!"); if (!alive(t)) return;
  for (let j = 0; j < words.length; j++) {
    const w = words[j];
    G.idx = j; renderDots();
    stage(cue(fresh ? '新单词！点图片可以再听一遍' : '复习一下！点图片可以再听一遍') +
      `<div class="cards" id="cards">${cardBtn(w, 0, 'big')}</div>` +
      `<button class="btn go next tap" type="button" data-id="next" aria-label="下一个">${SVG_NEXT}</button>`);
    const twice = async () => { await say(w.say); await wait(450); await say(w.say); };
    onSpeak = () => { hush(); twice(); };
    await wait(300); if (!alive(t)) return;
    await twice(); if (!alive(t)) return;
    const st = S.progress.words[w.id] || (S.progress.words[w.id] = {seen:0, r:0, w:0, k:0, t:0});
    st.seen++; st.t = Date.now(); touchProgress();
    for (;;) {
      const r = await nextTap(); if (!alive(t) || !r) return;
      if (r.dataset.id === 'next') break;
      hush(); r.classList.remove('bump'); void r.offsetWidth; r.classList.add('bump');
      say(w.say);
    }
  }
  hush();
  await say("Now let's play!"); if (!alive(t)) return;
  const order = shuffle(words);
  for (let j = 0; j < order.length; j++) {
    G.idx = words.length + j; renderDots();
    const target = order[j];
    let others = shuffle(words.filter(x => x.id !== target.id)).slice(0, 2);
    if (others.length < 2) others = others.concat(distractors(target, 2 - others.length, others.map(o => o.id)));
    await listenRound(t, target, shuffle([target, ...others])); if (!alive(t)) return;
    await maybeSticker(); if (!alive(t)) return;
    if (timeLeft() <= 0) break;
  }
  finishGame(t);
}

/* ---------- Catch It (whack-a-mole) ---------- */
function catchLine(w) {
  if (w.kind === 'color') return `Catch ${w.say}!`;
  if (w.kind === 'number') return `Catch number ${w.say}!`;
  return `Catch the ${w.say}!`;
}
async function catchRound(t, i) {
  const target = pickTarget(known());

  const easy = i < 2;
  const maxUp = easy ? 1 : 2, stay = easy ? 1900 : 1550, odds = easy ? 0.45 : 0.36;
  const NEED = 3, LIMIT = 35000;
  stage(cue('听到的那个才点，别的不要点！') +
    `<div class="catches" id="catches" aria-label="抓到的数量">${'<i></i>'.repeat(NEED)}</div>` +
    `<div class="field" id="field">${Array.from({length:9}, (_, j) => `<div class="cell" style="--c:${BRICK_COLORS[j % BRICK_COLORS.length]}"><button class="mole" type="button" tabindex="-1" aria-hidden="true"></button><span class="front"></span></div>`).join('')}</div>`);
  const field = $('#field'), cells = [...field.children], marks = [...$('#catches').children];
  onSpeak = () => { hush(); say(target.say); };
  await wait(300); if (!alive(t)) return;
  await say(catchLine(target)); if (!alive(t)) return;
  await wait(150); await say(target.say); if (!alive(t)) return;

  let hits = 0, wrong = 0, ended = false, sinceTarget = 0, popSeq = 0, finish;
  const done = new Promise(r => { finish = r; });
  const timers = new Set();
  const later = (fn, ms) => { const h = setTimeout(() => { timers.delete(h); fn(); }, ms); timers.add(h); };
  const down = cell => {
    cell.classList.remove('up');
    const seq = cell.dataset.pop;
    later(() => { if (cell.dataset.pop === seq) cell.dataset.busy = ''; }, 260);
  };
  const up = (cell, w) => {
    const m = cell.firstElementChild;
    m.className = 'mole'; m.innerHTML = picHTML(w);
    const seq = String(++popSeq);
    cell.dataset.id = w.id; cell.dataset.pop = seq; cell.dataset.busy = '1'; cell.dataset.hit = '';
    void cell.offsetWidth;
    cell.classList.add('up');
    later(() => { if (cell.dataset.pop === seq && !cell.dataset.hit) down(cell); }, stay + Math.random() * 300);
  };
  field.addEventListener('pointerdown', e => {
    const m = e.target.closest('.mole'); if (!m || ended) return;

      hits++; m.classList.add('good'); sfx.good();
      hush(); say(cap(target.say) + '!');
      if (marks[hits - 1]) marks[hits - 1].classList.add('on');
      later(() => down(cell), 380);
      if (hits >= NEED) { ended = true; later(() => finish('win'), 450); }
    } else {
      wrong++; m.classList.add('bad'); sfx.oops();
      later(() => down(cell), 450);
    }
  });
  const t0 = Date.now();
  (async () => {
    while (!ended) {
      if (!alive(t)) { ended = true; finish('gone'); return; }
      if (Date.now() - t0 > LIMIT) { ended = true; finish('time'); return; }
      if (cells.filter(c => c.dataset.busy === '1').length < maxUp) {
        const isTarget = sinceTarget >= 2 || Math.random() < odds;
        sinceTarget = isTarget ? 0 : sinceTarget + 1;
        up(pick(cells.filter(c => c.dataset.busy !== '1')), isTarget ? target : pick(ds));
      }
      await wait(480 + Math.random() * 420);
    }
  })();
  const how = await done;
  timers.forEach(clearTimeout); timers.clear();
  cells.forEach(c => c.classList.remove('up'));
  if (!alive(t)) return;
  const clean = how === 'win' && wrong === 0;
  recordWord(target, clean); recordRound(clean);
  const play = playEl.querySelector('.play');
  if (how === 'win' && wrong <= 1) {
    await giveStar($('#catches'));
    say(pick(PRAISE)); await wait(1200);
  } else if (how === 'win') {
    play.insertAdjacentHTML('beforeend', '<div class="note">只点听到的那个，别的不要点哦</div>');
    await say(`Careful! Only the ${target.say}!`); await wait(900);
  } else {
    play.insertAdjacentHTML('beforeend', `<div class="cards"><div class="pcard mid good">${picHTML(target)}</div></div>`);
    await say(`Look! ${nameOf(target)}!`); await wait(1300);
  }
}

/* ---------- What's Missing ---------- */
async function missingRound(t, i) {
  const k = known();
  const n = Math.min(i < 2 ? 3 : i < 4 ? 4 : 5, k.length);
  const set = [];
  while (set.length < n) {
    const left = k.filter(id => !set.some(s => s.id === id));
    set.push(WORDS[weightedPick(left)]);
  }
  const missIdx = Math.floor(Math.random() * n), miss = set[missIdx];
  stage(cue('记住这些图片！') +
    `<div class="cards" id="slots">${set.map((w, j) => `<div class="pcard mid" data-slot="${j}" style="visibility:hidden">${picHTML(w)}</div>`).join('')}</div>` +
    `<div class="cards tray" id="tray"></div>` +
    `<div class="eyes" id="eyes" hidden><span class="emoji">🙈</span><b id="eyesN">3</b></div>`);
  const slots = [...$('#slots').children];
  onSpeak = () => { hush(); say(set.map(w => w.say).join(', ')); };
  await wait(300); if (!alive(t)) return;
  await say('Look!'); if (!alive(t)) return;
  for (let j = 0; j < n; j++) {
    slots[j].style.visibility = 'visible';
    slots[j].style.animation = 'none'; void slots[j].offsetWidth; slots[j].style.animation = '';
    await say(set[j].say); if (!alive(t)) return;
    await wait(250);
  }
  await wait(1100); if (!alive(t)) return;
  onSpeak = null;
  const eyes = $('#eyes');
  eyes.hidden = false;
  say('Close your eyes!');
  for (let c = 3; c >= 1; c--) {
    $('#eyesN').textContent = c; sfx.tick();
    await wait(1000); if (!alive(t)) return;
  }
  const hole = slots[missIdx];
  hole.classList.add('hole'); hole.innerHTML = '<span class="q">?</span>';
  eyes.hidden = true;
  $('#hint').textContent = '少了哪一个？';
  const opts = shuffle([miss, ...distractors(miss, 2, set.map(s => s.id))]);
  $('#tray').innerHTML = opts.map((w, j) => cardBtn(w, j, 'mid')).join('');
  onSpeak = () => { hush(); say("What's missing?"); };
  await say("Open your eyes! What's missing?"); if (!alive(t)) return;
  let first = true;
  for (;;) {
    const c = await nextTap(); if (!alive(t) || !c) return;
    if (c.dataset.id === miss.id) {
      hush(); sfx.good();
      hole.classList.remove('hole'); hole.innerHTML = picHTML(miss); hole.classList.add('good');
      c.classList.add('off'); $('#tray').classList.add('done');
      recordWord(miss, first); recordRound(first);
      if (first) await giveStar(hole);
      say(`Yes! ${nameOf(miss)}!`); await wait(1400);
      return;
    }
    first = false; hush(); sfx.oops(); c.classList.add('shake', 'off');
    say('Try again!');
  }
}

/* ---------- runner ---------- */
async function startGame(kind) {
  if (timeIsUp || timeLeft() <= 0) { goDone(); return; }
  stopGame();
  const t = tok;
  if (kind !== 'learn' && known().length < MIN_KNOWN[kind]) {
    await say("Let's learn some new words first!");
    if (t !== tok) return;
    kind = 'learn';
  }
  const d = today(); d.plays[kind] = (d.plays[kind] || 0) + 1; dirty.day = true;
  try {
    if (kind === 'learn') { await playLearn(t); return; }
    setupPlay(kind, ROUNDS[kind]);
    for (let i = 0; i < G.total; i++) {
      if (!alive(t)) return;
      G.idx = i; renderDots();
      if (kind === 'listen') {
        const target = pickTarget(known());
        await listenRound(t, target, shuffle([target, ...distractors(target, i < 4 ? 2 : 3)]));
      } else if (kind === 'catch') await catchRound(t, i);
      else await missingRound(t, i);
      if (!alive(t)) return;
      await maybeSticker(); if (!alive(t)) return;
      if (timeLeft() <= 0) break;
    }
    finishGame(t);
  } catch (e) {
    console.error('[dino-bricks]', e);
    if (t === tok) { stopGame(); show('home'); }
  }
}
function finishGame(t) {
  if (!alive(t)) return;
  G.idx = G.total; renderDots();
  saveAll();
  const up = timeLeft() <= 0;
  const n = G.stars;
  $('#resultTitle').textContent = n ? 'Great job!' : 'Good try!';
  $('#resultStars').innerHTML = n ? Array.from({length:n}, (_, i) => `<span class="emoji" style="animation-delay:${i * 90}ms">⭐</span>`).join('') : '<span class="emoji">💪</span>';
  $('#resultNote').textContent = up ? '今天的时间到啦！' : (n ? `这一轮得到 ${n} 颗星星` : '再来一次，一定可以！');
  const kind = G.kind;
  $('#resultBtns').innerHTML = up
    ? `<button class="btn go" type="button" data-r="done">${SVG_HOME}<span>好的</span></button>`
    : `<button class="btn go" type="button" data-r="again">${SVG_AGAIN}<span>再玩一次</span></button><button class="btn" type="button" data-r="home">${SVG_HOME}<span>回首页</span></button>`;
  $('#resultOverlay').hidden = false;
  say(n ? `Great job! You got ${n} star${n > 1 ? 's' : ''}!` : 'Good try!');
  $('#resultBtns').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    $('#resultOverlay').hidden = true; hush();
    if (b.dataset.r === 'done') goDone();
    else if (b.dataset.r === 'again') startGame(kind);
    else { stopGame(); show('home'); }
  };
}

function confetti() {
  if (reduced) return;
  const c = $('#confetti'), ctx = c.getContext('2d'); if (!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--red','--yellow','--blue','--green','--orange','--purple'].map(v => cs.getPropertyValue(v).trim() || '#FFC531');
  const parts = Array.from({length:140}, () => ({
    x:W / 2 + (Math.random() - .5) * 120, y:H * .38, vx:(Math.random() - .5) * 14, vy:-Math.random() * 13 - 4,
    w:8 + Math.random() * 8, h:5 + Math.random() * 5, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:pick(cols),
  }));
  const t0 = performance.now();
  (function frame(now) {
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - el / 2200); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (el < 2200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

  else if (b.dataset.say) { actx(); hush(); say(b.dataset.say); }
});
$('#parentPanel').addEventListener('input', e => { if (e.target.id === 'ioText' && io.mode === 'restore') io.text = e.target.value; });
$('#parentPanel').addEventListener('change', e => {
  const c = e.target.closest('[data-unit]'); if (!c) return;
  const id = c.dataset.unit;
  let units = S.settings.units.filter(u => u !== id);
  if (c.checked) units = UNITS.map(u => u.id).filter(u => u === id || S.settings.units.includes(u));
  if (!units.length) { c.checked = true; return; }
  S.settings.units = units; saveSettings();
});
/* ---------- share summary + backup code ---------- */
let io = {mode:null, text:'', msg:'', err:false};
function ioHTML() {
  const msg = io.msg ? `<p class="io-msg${io.err ? ' err' : ''}">${esc(io.msg)}</p>` : '';
  if (!io.mode) return msg;
  const ro = io.mode !== 'restore' ? ' readonly' : '';
  const ph = io.mode === 'restore' ? ' placeholder="把以前复制的备份码粘贴到这里"' : '';
  const btns = io.mode === 'backup' ? `<button class="sbtn" type="button" data-act="io-copy">复制备份码</button>`
    : io.mode === 'restore' ? `<button class="sbtn" type="button" data-act="io-restore">确认恢复（会覆盖这台设备上现在的进度）</button>` : '';
  return `<div class="io"><textarea id="ioText" rows="4"${ro}${ph}>${esc(io.text)}</textarea>
    <div class="row">${btns}<button class="sbtn ghost" type="button" data-act="io-close">收起</button></div>${msg}</div>`;
}
function copyText(text, okMsg, fallback) {
  const ok = () => { io.msg = okMsg; io.err = false; renderParent(); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}
function summaryText() {
  const d = today(), st = S.progress.words, now = new Date();
  const learned = Object.keys(st).filter(id => WORDS[id] && st[id].seen > 0);
  const todays = learned.filter(id => st[id].t && dayKey(new Date(st[id].t)) === dayKey());
  const weak = learned.filter(id => st[id].w > 0 && st[id].k < 3).sort((a, b) => st[b].w - st[a].w).slice(0, 6);
  return [
    `Dino Bricks 英语 · ${now.getMonth() + 1}月${now.getDate()}日`,
    `今天玩了 ${Math.floor(d.seconds / 60)} 分钟（上限 ${Math.round(limitSec() / 60)}），得到 ${d.stars} 颗星星，一次答对率 ${pct(d.right, d.wrong)}`,
    `今天练到的词：${todays.length ? todays.map(id => WORDS[id].say).join(', ') : '无'}`,
    `需要多练：${weak.length ? weak.map(id => WORDS[id].say).join(', ') : '暂时没有'}`,
    `累计：已学 ${learned.length} 个词，掌握 ${learned.filter(id => st[id].k >= 3).length} 个，贴纸 ${stickerCount()}/${STICKERS.length}`,
  ].join('\n');
}
function makeBackup() {
  const days = {};
  for (const k of Object.keys(S.days).sort().slice(-30)) days[k] = S.days[k];
  const json = JSON.stringify({v:1, progress:S.progress, settings:S.settings, days});
  return 'DINO1:' + btoa(unescape(encodeURIComponent(json)));
}
function restoreBackup() {
  const box = document.getElementById('ioText');
  const raw = (box ? box.value : io.text).trim().replace(/\s+/g, '');
  let data = null;
  try { if (raw.startsWith('DINO1:')) data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(6))))); } catch (e) { data = null; }
  if (!data || !data.progress) { io.text = raw; io.msg = '备份码不对。请把复制的整段文字完整粘贴进来，开头是 DINO1:'; io.err = true; renderParent(); return; }
  S.progress = normProgress(data.progress);
  S.settings = normSettings(data.settings);
  if (data.days && typeof data.days === 'object') for (const k of Object.keys(data.days)) {
    const r = normDay(data.days[k], k), cur = S.days[k];
    if (!cur || r.seconds > cur.seconds) S.days[k] = r;
  }
  touchProgress(); dirty.day = true; saveAll(); saveSettings();
  io = {mode:null, text:'', msg:`已恢复：${Object.keys(S.progress.words).length} 个词的记录，${stickerCount()} 张贴纸。`, err:false};
  refreshAll();
}
async function refreshFromCloud() {
  if (!db) { renderParent(); loadDays(); return; }
  try {
    const [p, s] = await Promise.all([db.doc('kid/progress').get(), db.doc('kid/settings').get()]);
    if (p.exists) { const r = normProgress(clone(p.data())); if (r.updatedAt > S.progress.updatedAt) S.progress = r; }
    if (s.exists) { const r = normSettings(clone(s.data())); if (r.updatedAt > S.settings.updatedAt) S.settings = r; }
    persistLocal();
  } catch (e) { onDbError(e); }
  refreshAll(); loadDays();
}

/* =====================================================================
   BOOT
   ===================================================================== */
function start() {
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }
  renderTimer();
  renderTowers();
  show('start');
  connect();
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => { persistLocal(); return {}; }); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start();
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// ask the browser not to evict the saved progress when space runs low
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
