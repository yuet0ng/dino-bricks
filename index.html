<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Bricks English</title>
<meta name="description" content="7岁零基础孩子的英语听力小游戏">
<meta name="theme-color" content="#BCE2CC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dino Bricks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
  <script type="module" crossorigin src="./assets/index-u3G8cBgy.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-eIEQuchj.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="icon-btn" id="homeBtn" type="button" aria-label="回到首页" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 19.5v-5h4v5z" fill="currentColor"/></svg>
    </button>
    <div class="logo" id="logo"><span class="mark" aria-hidden="true"></span><span>Dino <b>Bricks</b></span></div>
    <div class="dots" id="dots" hidden></div>
    <div class="bar-right">
      <div class="mini-tower" id="miniTower" aria-label="积木进度" hidden></div>
      <div class="pill timer" id="timer" aria-label="今天剩余时间">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4l3 2M9 3h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span id="timerText">10</span><small>分钟</small>
        <span class="gauge"><em id="timerFill"></em></span>
      </div>
      <button class="parent-btn" id="parentBtn" type="button" title="家长请长按">
        <span class="fill"></span><span id="parentLabel">家长</span>
      </button>
    </div>
  </header>

  <main id="stage">
    <section id="scr-start" class="screen center">
      <div class="hero">
        <div class="hero-pic">
          <span class="emoji dino">🦖</span>
          <div class="hero-bricks" aria-hidden="true">
            <i style="--c:var(--yellow);--w:96px"></i>
            <i style="--c:var(--blue);--w:132px"></i>
            <i style="--c:var(--red);--w:168px"></i>
          </div>
        </div>
        <h1 class="title">Dino <b>Bricks</b></h1>
        <p class="sub">听英语 · 玩游戏 · 搭积木</p>
        <button class="playbtn" id="startBtn" type="button" aria-label="开始">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <p class="tapnote">点一下开始</p>
      </div>
    </section>

    <section id="scr-home" class="screen" hidden>
      <div class="home">
        <aside class="tower-card" aria-label="我的积木塔">
          <div class="tower-label"><b id="brickCount">0</b><span>/10</span></div>
          <div class="total"><span class="emoji">⭐</span><b id="totalStars">0</b></div>
          <div class="tower" id="tower"></div>
          <p class="tower-note">每答对一题加一块积木<br>搭满 10 块，换一张新贴纸</p>
        </aside>
        <div class="games">
          <button class="game" type="button" data-game="learn" style="--c:var(--yellow);--fg:var(--ink)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🐣</span>
            <span class="txt"><span class="h">New Words</span><span class="zh">认识新词</span><em class="badge" id="learnBadge"></em></span>
          </button>
          <button class="game" type="button" data-game="listen" style="--c:var(--blue)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">👂</span>
            <span class="txt"><span class="h">Listen &amp; Tap</span><span class="zh">听音找图</span></span>
          </button>
          <button class="game" type="button" data-game="catch" style="--c:var(--green)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🔨</span>
            <span class="txt"><span class="h">Catch It!</span><span class="zh">打地鼠：只点听到的</span></span>
          </button>
          <button class="game" type="button" data-game="missing" style="--c:var(--red)">
            <span class="studs"><i></i><i></i><i></i></span>
            <span class="pic emoji">🙈</span>
            <span class="txt"><span class="h">What's Missing?</span><span class="zh">少了哪一个</span></span>
          </button>
          <button class="game wide" type="button" data-game="album" style="--c:var(--purple)">
            <span class="studs"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="pic emoji" id="albumPreview">🏆</span>
            <span class="txt"><span class="h">My Stickers</span><span class="zh" id="albumZh">我的贴纸</span></span>
          </button>
        </div>
      </div>
    </section>

    <section id="scr-play" class="screen" hidden></section>

    <section id="scr-album" class="screen" hidden>
      <div class="album-head"><h2 class="title small">My Stickers</h2><p class="sub" id="albumCount"></p></div>
      <div class="album" id="album"></div>
    </section>

    <section id="scr-done" class="screen center" hidden>
      <div class="hero">
        <div class="hero-pic"><span class="emoji dino">🦖</span><span class="zz" aria-hidden="true">z z</span></div>
        <h1 class="title small">See you tomorrow!</h1>
        <p class="sub">今天的时间用完啦，明天再来玩！</p>
        <div class="today-stars" id="doneStars"></div>
        <div class="shelf emoji" id="doneShelf"></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="resultOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">Great job!</h2>
    <div class="starrow" id="resultStars"></div>
    <p id="resultNote"></p>
    <div class="btnrow" id="resultBtns"></div>
  </div>
</div>

<div class="overlay" id="stickerOverlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stickerTitle">
    <h2 id="stickerTitle">New sticker!</h2>
    <div class="sticker-stage"><div class="sun"></div><span class="emoji sticker-big" id="stickerBig">🦖</span></div>
    <p>积木塔搭好啦，得到一张新贴纸！</p>
    <button class="btn go" id="stickerOk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17l9-10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>收下</span>
    </button>
  </div>
</div>

<div class="sheet-wrap" id="parentPanel" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
